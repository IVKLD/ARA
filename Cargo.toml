[workspace]
resolver = "2"
members = [
    "crates/ara_core",
    "crates/ara_render",
    "crates/ara_compiler",
    "crates/ara",
    "examples/retained_button",
    "examples/counter",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
winit = { version = "0.30", default-features = false, features = ["wayland", "rwh_06"] }
wgpu = "24"
reactive_graph = { version = "0.1", default-features = false, features = ["effects"] }
any_spawner = { version = "0.2", default-features = false, features = ["futures-executor"] }
futures = { version = "0.3", default-features = false, features = ["executor"] }
slotmap = "1.1"
parking_lot = "0.13"
bytemuck = { version = "1.22", features = ["derive"] }
pollster = "0.4"
taffy = "0.7"
grass = { version = "0.13", default-features = false }
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
